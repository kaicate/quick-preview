name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish MSIX
    runs-on: windows-latest
    environment: release
    env:
      WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5

      - name: Validate release configuration
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match '^v(?<version>\d+\.\d+\.\d+)$') {
            $tagVersion = $Matches.version
          } else {
            throw "Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0."
          }

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($metadata.packages | Where-Object name -eq "quick-preview").version
          if ($tagVersion -ne $cargoVersion) {
            throw "Tag version $tagVersion does not match Cargo.toml version $cargoVersion."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER)) {
            throw "Set the WINDOWS_PUBLISHER variable in the release environment."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "Set the WINDOWS_CERTIFICATE_BASE64 secret in the release environment."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Set the WINDOWS_CERTIFICATE_PASSWORD secret in the release environment."
          }

          $packageVersion = "$tagVersion.0"
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          "MSIX_NAME=QuickPreview-$packageVersion-x64.msix" >> $env:GITHUB_ENV
          "APPINSTALLER_URI=https://github.com/${{ github.repository }}/releases/latest/download/QuickPreview.appinstaller" >> $env:GITHUB_ENV
          "MSIX_URI=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/QuickPreview-$packageVersion-x64.msix" >> $env:GITHUB_ENV

      - name: Install the Rust MSVC target
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Restore signing certificate
        id: certificate
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "quick-preview-signing.pfx"
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP "quick-preview-signing.cer"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 is not valid base64."
          }
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "path=$certificatePath" >> $env:GITHUB_OUTPUT
          "public_path=$publicCertificatePath" >> $env:GITHUB_OUTPUT

          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          try {
            if (-not $certificate.HasPrivateKey) {
              throw "The signing PFX does not contain a private key."
            }
            if ($certificate.Subject -ne $env:WINDOWS_PUBLISHER) {
              throw "WINDOWS_PUBLISHER does not match the signing certificate subject."
            }

            $publicBytes = $certificate.Export(
              [Security.Cryptography.X509Certificates.X509ContentType]::Cert
            )
            [IO.File]::WriteAllBytes($publicCertificatePath, $publicBytes)
            $trustedCertificate = Import-Certificate `
              -FilePath $publicCertificatePath `
              -CertStoreLocation Cert:\LocalMachine\TrustedPeople

            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
            "trusted_thumbprint=$($trustedCertificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            $certificate.Dispose()
          }

      - name: Build and sign package
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          ./packaging/build-msix.ps1 `
            -Publisher $env:WINDOWS_PUBLISHER `
            -Version $env:PACKAGE_VERSION `
            -CertificatePath "${{ steps.certificate.outputs.path }}" `
            -CertificatePassword $password `
            -AppInstallerUri $env:APPINSTALLER_URI `
            -MsixUri $env:MSIX_URI

      - name: Verify package signature and installer metadata
        shell: pwsh
        run: |
          $msixPath = Join-Path "target/package" $env:MSIX_NAME
          $signature = Get-AuthenticodeSignature $msixPath
          if ($signature.Status -ne "Valid") {
            throw "MSIX signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($signature.SignerCertificate.Thumbprint -ne "${{ steps.certificate.outputs.thumbprint }}") {
            throw "MSIX was not signed by the configured certificate."
          }

          [xml]$installer = Get-Content "target/package/QuickPreview.appinstaller" -Raw
          $root = $installer.DocumentElement
          if ($root.Version -ne $env:PACKAGE_VERSION) {
            throw "App Installer version does not match $env:PACKAGE_VERSION."
          }
          if ($root.MainPackage.Uri -ne $env:MSIX_URI) {
            throw "App Installer package URI is incorrect."
          }

          $installerPath = "target/package/QuickPreview.appinstaller"
          $checksums = @(
            "$((Get-FileHash $msixPath -Algorithm SHA256).Hash.ToLowerInvariant())  $env:MSIX_NAME"
            "$((Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant())  QuickPreview.appinstaller"
          )
          $checksums | Set-Content "target/package/QuickPreview-checksums.txt" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/package/$env:MSIX_NAME" `
            "target/package/QuickPreview.appinstaller" `
            "target/package/QuickPreview-checksums.txt" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --generate-notes `
            --latest `
            --title "QuickPreview ${{ github.ref_name }}"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $trustedThumbprint = "${{ steps.certificate.outputs.trusted_thumbprint }}"
          if ($trustedThumbprint) {
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$trustedThumbprint" `
              -Force -ErrorAction SilentlyContinue
          }
          $paths = @(
            "${{ steps.certificate.outputs.path }}"
            "${{ steps.certificate.outputs.public_path }}"
          ) | Where-Object { $_ }
          $paths | ForEach-Object {
            Remove-Item -LiteralPath $_ -Force -ErrorAction SilentlyContinue
          }
