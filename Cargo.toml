[package]
name = "quick-preview"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "A lightweight Windows preview and editor for CSV, TSV, Markdown, and HTML"

[lib]
name = "quick_preview"
path = "src/lib.rs"

[[bin]]
name = "QuickPreview"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8.35"
memmap2 = "0.9.5"
pulldown-cmark = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-numerics = "0.3.1"
windows = { version = "0.62.0", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
